<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563EB;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="20" fill="url(#grad)" />
  <!-- Dollar sign -->
  <text x="50" y="72" font-family="Arial, sans-serif" font-size="56" font-weight="bold" fill="white" text-anchor="middle">$</text>
  <!-- Small coins for decoration -->
  <circle cx="25" cy="25" r="6" fill="white" opacity="0.2" />
  <circle cx="75" cy="75" r="8" fill="white" opacity="0.15" />
  <circle cx="78" cy="22" r="4" fill="white" opacity="0.2" />
</svg>